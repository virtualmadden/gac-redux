[profile.ci]
fail-fast = false
# Most tests wait on child processes (gac, the AWS CLI) and the mock rather than on the CPU, so
# CI runners (3-4 cores) finish sooner running more of them at once than they have cores.
test-threads = 8
failure-output = "immediate-final"
# The interop tests start the AWS CLI, which is slow to boot on Windows runners.
slow-timeout = { period = "60s", terminate-after = 5 }
