[package]
name = "gac-redux"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1" # MSRV of the AWS SDK crates; std File::lock needs 1.89
description = "Short-lived AWS credentials through IAM Identity Center, interoperable with the AWS CLI and SDKs"
repository = "https://github.com/virtualmadden/gac-redux"
license = "MIT OR Apache-2.0"
# Released as GitHub release binaries and a Homebrew formula, not on crates.io.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gac"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1.13", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-sso = { version = "1.117", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-ssooidc = { version = "1.119", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-runtime = "1.10"
aws-types = "1.7"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
globset = "0.4"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
inquire = "0.9"
jiff = { version = "0.2", features = ["serde"] }
miette = { version = "7", features = ["fancy"] }
percent-encoding = "2.3"
rand = "0.10"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
similar = "3"
tempfile = "3.27"
textwrap = { version = "0.16", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
webbrowser = "1.2"
clap_complete = "4.6"
clap_mangen = "0.3"
roff = "1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-native-certs = "0.8"
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }

[dev-dependencies]
assert_cmd = "2.2"
aws-config = { version = "1.13", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest", "sso", "credentials-process"] }
aws-credential-types = "1"
insta = { version = "1.49", features = ["json", "filters"] }
predicates = "3"
proptest = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# Drives the prompts through a pseudo-terminal, as a person at the terminal sees them.
rexpect = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
