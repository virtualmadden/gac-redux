name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N) that matches the version in Cargo.toml builds the
# binaries and the Linux packages, publishes a GitHub release (a pre-release when the version has a
# suffix) with the notes in docs/release-notes/X.Y.Z.md, and updates the formula in
# virtualmadden/homebrew-tap. Every asset gets a signed build provenance attestation, and the
# archives and packages an SBOM attestation. A pull request that changes the release files runs
# everything up to publishing, so a broken release is caught before the tag.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gac-redux") | .version')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if [ ! -s "docs/release-notes/$version.md" ]; then
            echo "::error::docs/release-notes/$version.md is missing or empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Completions and man pages are the same on every platform, and not every build can run its
  # binary (x86_64-apple-darwin builds on arm64), so one host build generates them all.
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - name: Generate
        run: |
          gac=target/debug/gac
          mkdir -p extras/completions
          $gac completions bash > extras/completions/gac.bash
          $gac completions zsh > extras/completions/_gac
          $gac completions fish > extras/completions/gac.fish
          $gac completions powershell > extras/completions/_gac.ps1
          $gac completions elvish > extras/completions/gac.elv
          $gac man extras/man
          bash -n extras/completions/gac.bash
          ls -R extras
      - uses: actions/upload-artifact@v7
        with:
          name: extras
          path: extras/
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [version, extras]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # The oldest supported Ubuntu, so the binaries need only an old glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      NAME: gac-redux-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: extras
          path: ${{ env.NAME }}
      - name: Package
        shell: bash
        run: |
          cp README.md LICENSE-MIT LICENSE-APACHE "$NAME/"
          test -s "$NAME/man/gac.1" && test -s "$NAME/completions/_gac"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/gac.exe" "$NAME/"
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/gac" "$NAME/"
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="$NAME/gac"
          [ "${{ runner.os }}" = Windows ] && bin="$NAME/gac.exe"
          "$bin" --version | grep -Fx "gac-redux ${{ needs.version.outputs.version }}"
      # .cargo/config.toml links the C runtime statically, so gac.exe runs on a Windows without
      # the Visual C++ Redistributable.
      - name: No Visual C++ runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tools="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          imports=$("$tools/llvm-readobj.exe" --coff-imports "$NAME/gac.exe" | sed -n 's/^ *Name: //p')
          echo "$imports"
          if grep -i -E '^(vcruntime|msvcp|api-ms-win-crt)' <<< "$imports"; then
            echo "::error::gac.exe needs the Visual C++ runtime"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # .deb and .rpm made from the Linux archives, then installed, run and removed on the
  # distributions they are for.
  linux-packages:
    name: linux packages (${{ matrix.target }})
    needs: [version, build]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, nfpm: x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, nfpm: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      NAME: gac-redux-${{ needs.version.outputs.version }}-${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      NFPM_VERSION: 2.48.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.NAME }}
      - name: Install nfpm
        run: |
          archive=nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz
          base=https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION
          curl -fsSLO "$base/$archive" -O "$base/checksums.txt"
          awk -v name="$archive" '$2 == name' checksums.txt | sha256sum -c --strict -
          sudo tar -xzf "$archive" -C /usr/local/bin nfpm
          rm "$archive" checksums.txt
      - name: Package
        run: |
          tar -xzf "$NAME.tar.gz"
          .github/scripts/linux-packages.sh "$VERSION" "$NAME" packages
          ls -l packages
      # Docker Hub fails a pull now and then (a 500 stopped the 0.6.0 release), so the images are
      # pulled first, with retries, and a failure to pull is not a failed package.
      - name: Pull the images
        run: |
          for image in debian:stable-slim ubuntu:22.04 ubuntu:latest fedora:latest; do
            for attempt in 1 2 3 4 5; do
              docker pull -q "$image" && continue 2
              echo "::warning::could not pull $image (attempt $attempt of 5)"
              [ "$attempt" -lt 5 ] && sleep $((attempt * 10))
            done
            echo "::error::could not pull $image"
            exit 1
          done
      - name: Install on Debian, Ubuntu and Fedora
        run: |
          for image in debian:stable-slim ubuntu:22.04 ubuntu:latest; do
            docker run --rm -v "$PWD:/w" -w /w "$image" \
              .github/scripts/test-linux-package.sh packages/*.deb "$VERSION"
          done
          docker run --rm -v "$PWD:/w" -w /w fedora:latest \
            .github/scripts/test-linux-package.sh packages/*.rpm "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-packages
          path: packages/*
          if-no-files-found: error

  checksums:
    needs: [version, build, linux-packages]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gac-redux-*
          merge-multiple: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.10
      - name: SBOM, checksums and manifests
        run: |
          # The CycloneDX SBOM of every crate in the binary on every target, a release asset too.
          cargo cyclonedx --format json --spec-version 1.5 --target all --no-build-deps \
            --override-filename "gac-redux-$VERSION.cdx"
          mv "gac-redux-$VERSION.cdx.json" dist/
          jq -e '.metadata.component.version == env.VERSION' "dist/gac-redux-$VERSION.cdx.json"
          (cd dist && sha256sum gac-redux-* > SHA256SUMS && cat SHA256SUMS)
          .github/scripts/homebrew-formula.sh "$VERSION" dist/SHA256SUMS > dist/gac-redux.rb
          ruby -c dist/gac-redux.rb
          .github/scripts/scoop-manifest.sh "$VERSION" dist/SHA256SUMS > dist/gac-redux.json
          jq . dist/gac-redux.json
          .github/scripts/winget-manifests.sh "$VERSION" dist/SHA256SUMS dist/winget
          tail -n +1 dist/winget/*
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      # Build provenance for every asset in SHA256SUMS, and the SBOM for the archives and
      # packages, so `gh attestation verify FILE --repo virtualmadden/gac-redux` checks a download.
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/gac-redux-*.tar.gz
            dist/gac-redux-*.zip
            dist/gac-redux-*.deb
            dist/gac-redux-*.rpm
          sbom-path: dist/gac-redux-${{ needs.version.outputs.version }}.cdx.json
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          for file in dist/gac-redux-*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$WORKFLOW"
            case "$file" in *.cdx.json) continue ;; esac
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$WORKFLOW" \
              --predicate-type https://cyclonedx.org/bom
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          # The notes written for users, then GitHub's list of the merged pull requests.
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --notes-file "docs/release-notes/$VERSION.md" --generate-notes \
            --title "gac-redux $VERSION" "${prerelease[@]}" dist/gac-redux-* dist/SHA256SUMS

  homebrew:
    if: github.event_name == 'push'
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - uses: actions/checkout@v7
        with:
          repository: virtualmadden/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p tap/Formula
          cp dist/gac-redux.rb tap/Formula/gac-redux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gac-redux.rb
          git commit -m "gac-redux $VERSION"
          git push

  # The Scoop manifest is installed from the published release, on both architectures, before
  # the bucket gets it.
  scoop-test:
    if: github.event_name == 'push'
    needs: [version, release]
    name: scoop (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Install with Scoop
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          # A full path: Scoop reads `dist/gac-redux.json` as app `gac-redux.json` in bucket `dist`.
          scoop install "$PWD\dist\gac-redux.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = gac --version
          if ($version -ne "gac-redux $env:VERSION") { throw "gac --version printed: $version" }

  scoop:
    if: github.event_name == 'push'
    needs: [version, scoop-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - uses: actions/checkout@v7
        with:
          repository: virtualmadden/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          path: bucket
      - name: Update the manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p bucket/bucket
          cp dist/gac-redux.json bucket/bucket/gac-redux.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/gac-redux.json
          git commit -m "gac-redux $VERSION"
          git push

  # komac checks the winget manifests on every run. After a release it opens a pull request to
  # microsoft/winget-pkgs from a fork owned by the WINGET_TOKEN account, whose pipeline installs
  # the package before a maintainer merges it. Pre-releases stay out of winget.
  winget:
    needs: [version, checksums, release]
    if: >-
      !cancelled() && needs.checksums.result == 'success' &&
      (github.event_name != 'push' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    env:
      KOMAC_VERSION: 2.17.1
      SUBMIT: ${{ github.event_name == 'push' && !contains(needs.version.outputs.version, '-') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Install komac
        run: |
          archive=komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION
          curl -fsSLO "$base/$archive" -O "$base/SHA256SUMS"
          awk -v name="*$archive" '$2 == name' SHA256SUMS | sha256sum -c --strict -
          tar -xzf "$archive" komac
          ./komac --version
      - name: Check the manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./komac submit dist/winget --dry-run
      - name: Submit
        if: env.SUBMIT == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: ./komac submit dist/winget --yes
