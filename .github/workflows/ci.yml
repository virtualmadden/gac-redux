name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main gets a group of its own,
# so its run is never cancelled or replaced: a push of documentation alone skips the build, and
# losing the run before it would leave a code change on main that was never built there.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Backtraces need only file and line; full debug info would make the builds slower to link.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Whether the change touches anything beyond the documentation. A change to documentation
  # alone skips the jobs that build and test gac; a skipped job counts as passing, so this keeps
  # working when checks are required.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs='^(README\.md|CONTRIBUTING\.md|SECURITY\.md|CODE_OF_CONDUCT\.md|LICENSE-[A-Z]+|docs/.*|\.github/ISSUE_TEMPLATE/.*)$'
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            grep -qvE "$docs" <<< "$changed" || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore main's cache without saving their own copy, which keeps the
          # repository under GitHub's 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      # The interop tests run against the runner's AWS CLI v2 and must not skip.
      GAC_REDUX_REQUIRE_AWS_CLI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore main's cache without saving their own copy, which keeps the
          # repository under GitHub's 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: aws --version
      - run: cargo nextest run --locked --profile ci

  # A release pull request bumps the version, so it must add the notes the release publishes
  # and name the version wherever docs/releasing.md says to.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gac-redux") | .version')
          status=0
          if [ ! -s "docs/release-notes/$version.md" ]; then
            echo "::error::add docs/release-notes/$version.md: what changed in $version for someone running gac"
            status=1
          fi
          for needle in "gac-redux-$version-amd64.deb:README.md" "gac-redux-$version-x86_64.rpm:README.md" "gac-redux $version:.github/ISSUE_TEMPLATE/bug.yml"; do
            if ! grep -qF "${needle%%:*}" "${needle#*:}"; then
              echo "::error file=${needle#*:}::name version $version: expected \"${needle%%:*}\""
              status=1
            fi
          done
          exit $status

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore main's cache without saving their own copy, which keeps the
          # repository under GitHub's 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The one check to require before merging. It passes when every job above passed, or was
  # skipped for a documentation-only change, and its name never depends on a matrix (a skipped
  # matrix job reports as `test (${{ matrix.os }})`, not once per OS).
  ci:
    if: always()
    needs: [changes, fmt, clippy, test, release-notes, msrv, deny]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a CI job ended with: $result"; exit 1 ;;
            esac
          done
