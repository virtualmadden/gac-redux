name: Feature request
description: Something gac could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and where gac gets in the way or falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: A command, flag or behavior you have in mind, if any.
